[package]
name = "ccatoken"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/veraison/rust-ccatoken"
license = "Apache-2.0"
description = "CCA attestation token decoding, verification, and appraisal"
keywords = ["Arm", "CCA", "attestation"]
categories = ["cryptography", "parser implementations"]
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.23.1"
ciborium = "0.2.2"
multimap = "0.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
hex = { version = "0.4", features = ["serde"] }
thiserror = "2"
hex-literal = "1.1.0"
bitflags = "2.11.0"
serde_with = { version = "3.14.0", features = ["hex"] }
jsonwebtoken = "11.0.0"
cose-rust = "0.1.7"
ear = "0.6.0"
clap = { version = "4.4.10", features = ["derive"] }
openssl = "0.10.72"

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
